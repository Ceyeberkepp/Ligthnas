name: Validate Host Agent Temp
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  pycompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile privileged host agent
        run: python3 -m py_compile scripts/lightnas-host-agent.py
