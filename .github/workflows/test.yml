name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Enforce LightNAS platform contract
        run: npm run check:platform

      - name: Low-memory control-plane smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/lightnas-ci
          mkdir -p /tmp/lightnas-ci
          NAS_DATA_FILE=/tmp/lightnas-ci/state.json \
          NAS_HOST=127.0.0.1 \
          NAS_PORT=3081 \
          NODE_OPTIONS=--max-old-space-size=256 \
            node src/server.mjs >/tmp/lightnas-ci/server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:3081/api/status >/dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done

          if [[ "$ready" != 1 ]]; then
            cat /tmp/lightnas-ci/server.log
            exit 1
          fi

          rss_kib="$(ps -o rss= -p "$pid" | tr -d ' ')"
          echo "Idle control-plane RSS: ${rss_kib} KiB"
          [[ "${rss_kib:-0}" -gt 0 ]]
          [[ "$rss_kib" -le 307200 ]]

      - name: Validate JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/container-presets.js
          node --check public/dialog-controls.js
          node --check public/enhancements.js
          node --check public/templates.js
          node --check public/storage-manager.js
          node --check public/admin-security.js
          node --check public/identity-providers.js
          for file in src/*.mjs; do node --check "$file"; done

      - name: Validate shell syntax
        run: |
          bash -n install.sh
          bash -n iso/build.sh
          bash -n scripts/bootstrap.sh
          bash -n scripts/proxmox-lxc-install.sh
          bash -n scripts/configure-proxmox.sh
          bash -n scripts/provision-runtimes.sh
          bash -n scripts/configure-appliance-network.sh
          bash -n scripts/start.sh

      - name: Validate privileged host agents
        run: |
          python3 -m py_compile scripts/lightnas-host-agent.py
          python3 -m py_compile scripts/proxmox-host-agent.py
          python3 -m py_compile scripts/proxmox-host-agent-v2.py
