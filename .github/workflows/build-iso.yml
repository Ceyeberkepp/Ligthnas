name: Build LightNAS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap xorriso squashfs-tools debian-archive-keyring cpio curl
          curl -fsSLo /tmp/live-build.deb https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb
          sudo apt-get install -y /tmp/live-build.deb
      - name: Build installer image
        run: sudo bash iso/build.sh
      - name: Check ISO format
        run: |
          file dist/LightNAS-amd64.iso
          sha256sum -c dist/LightNAS-amd64.iso.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LightNAS-amd64-iso
          path: |
            dist/LightNAS-amd64.iso
            dist/LightNAS-amd64.iso.sha256
