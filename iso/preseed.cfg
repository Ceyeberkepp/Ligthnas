# LightNAS installer defaults.
# Hardware and network discovery remain automatic. The target installation disk
# is still chosen explicitly by the operator before destructive writes.
d-i netcfg/get_hostname string lightnas
d-i netcfg/get_domain string local
d-i clock-setup/utc boolean true
d-i time/zone string UTC

# LightNAS recommended disk layout.
# The target disk is intentionally NOT preseeded. Debian Installer still asks
# the operator which disk to erase/use.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select lightnas

# OS first, then use the remaining disk for LightNAS local data.
# UEFI systems receive an EFI system partition. BIOS installs ignore that
# recipe item when the partition table is not GPT.
d-i partman-auto/expert_recipe string                         \
      lightnas ::                                            \
              538 538 1075 free                              \
                      $iflabel{ gpt }                         \
                      $reusemethod{ }                         \
                      method{ efi }                           \
                      format{ }                               \
              .                                               \
              32768 32768 32768 ext4                         \
                      $primary{ } $bootable{ }                \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ ext4 }    \
                      mountpoint{ / }                         \
              .                                               \
              1024 2048 4096 linux-swap                      \
                      method{ swap } format{ }                \
              .                                               \
              4096 10000 1000000000 ext4                     \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ ext4 }    \
                      mountpoint{ /var/lib/lightnas/storage/local } \
              .

# Keep the normal final confirmation screen. LightNAS never suppresses the
# destructive-write confirmation for the selected installation disk.
d-i partman/mount_style select uuid
