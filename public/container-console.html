<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LightNAS Container Terminal</title>
  <style>
    :root { color-scheme:dark; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; background:#071019; color:#d8f3e8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:#05090d; }
    header { min-height:52px; display:flex; align-items:center; gap:12px; padding:8px 14px; border-bottom:1px solid #20323e; background:#0c1821; font-family:Inter,ui-sans-serif,system-ui,sans-serif; }
    header strong { margin-right:auto; color:#e9f4f7; }
    #status { color:#9fb4bf; font-size:12px; }
    #terminal { flex:1; min-height:300px; margin:0; padding:16px; overflow:auto; white-space:pre-wrap; word-break:break-word; color:#baf7dc; background:#020608; }
    form { display:flex; gap:8px; padding:10px; border-top:1px solid #20323e; background:#0c1821; }
    input { flex:1; min-width:0; border:1px solid #2b4655; background:#071019; color:#fff; border-radius:8px; padding:10px 12px; font:inherit; }
    button { border:1px solid #287565; background:#0f8b78; color:white; border-radius:8px; padding:10px 14px; cursor:pointer; }
    .error { color:#ff9a9a !important; }
  </style>
</head>
<body>
  <header><strong id="title">Container terminal</strong><span id="status">Connecting…</span></header>
  <pre id="terminal" aria-live="polite"></pre>
  <form id="command-form" autocomplete="off"><input id="command" placeholder="Type a command and press Enter" autofocus><button>Send</button></form>
  <script>
    const params = new URLSearchParams(location.search);
    const name = params.get('name') || '';
    const title = document.querySelector('#title');
    const status = document.querySelector('#status');
    const terminal = document.querySelector('#terminal');
    const input = document.querySelector('#command');
    title.textContent = `${name || 'Container'} · terminal`;

    if (!/^lightnas-[a-z0-9][a-z0-9-]{0,60}$/.test(name)) {
      status.textContent = 'Invalid container name';
      status.classList.add('error');
      throw new Error('Invalid container name');
    }

    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${location.host}/api/console/container/${encodeURIComponent(name)}`);
    ws.binaryType = 'arraybuffer';
    const append = text => {
      terminal.textContent += text;
      terminal.scrollTop = terminal.scrollHeight;
    };
    ws.addEventListener('open', () => {
      status.textContent = 'Connected';
      append(`Connected to ${name}\n$ `);
      input.focus();
    });
    ws.addEventListener('message', async event => {
      const text = typeof event.data === 'string' ? event.data : new TextDecoder().decode(event.data);
      append(text);
    });
    ws.addEventListener('close', event => {
      status.textContent = 'Terminal closed';
      append(`\n[connection closed: ${event.reason || event.code}]\n`);
    });
    ws.addEventListener('error', () => {
      status.textContent = 'Connection error';
      status.classList.add('error');
    });

    document.querySelector('#command-form').addEventListener('submit', event => {
      event.preventDefault();
      const command = input.value;
      if (!command || ws.readyState !== WebSocket.OPEN) return;
      append(`${command}\n`);
      ws.send(`${command}\n`);
      input.value = '';
    });
  </script>
</body>
</html>
