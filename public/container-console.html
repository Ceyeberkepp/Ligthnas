<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LightNAS Container Terminal</title>
  <link rel="stylesheet" href="/xterm/css/xterm.css">
  <style>
    :root { color-scheme:dark; font-family:Inter,ui-sans-serif,system-ui,sans-serif; background:#071019; color:#d8f3e8; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; }
    body { margin:0; min-height:100vh; display:flex; flex-direction:column; overflow:hidden; background:#020608; }
    header { min-height:52px; display:flex; align-items:center; gap:12px; padding:8px 14px; border-bottom:1px solid #20323e; background:#0c1821; }
    header strong { margin-right:auto; color:#e9f4f7; }
    #status { color:#9fb4bf; font-size:12px; }
    #terminal { flex:1; min-height:0; padding:8px; overflow:hidden; background:#020608; }
    #terminal .xterm { height:100%; }
    [hidden] { display:none !important; }
    form { display:flex; gap:8px; padding:10px; border-top:1px solid #20323e; background:#0c1821; }
    input { flex:1; min-width:0; border:1px solid #2b4655; background:#071019; color:#fff; border-radius:8px; padding:10px 12px; font:14px ui-monospace,SFMono-Regular,Consolas,monospace; }
    button { border:1px solid #287565; background:#0f8b78; color:white; border-radius:8px; padding:10px 14px; cursor:pointer; }
    .error { color:#ff9a9a !important; }
  </style>
</head>
<body>
  <header><strong id="title">Container terminal</strong><span id="status">Connecting…</span></header>
  <div id="terminal" role="application" aria-label="Interactive root terminal"></div>
  <form id="command-form" autocomplete="off" hidden><input id="command" placeholder="Fallback command mode"><button>Send</button></form>
  <script src="/xterm/lib/xterm.js" defer></script>
  <script src="/xterm-addon-fit/lib/addon-fit.js" defer></script>
  <script src="/container-console.js?v=20260922-4" defer></script>
</body>
</html>
