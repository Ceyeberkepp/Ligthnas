<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LightNAS Container Terminal</title>
  <style>
    :root { color-scheme:dark; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; background:#071019; color:#d8f3e8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:#05090d; }
    header { min-height:52px; display:flex; align-items:center; gap:12px; padding:8px 14px; border-bottom:1px solid #20323e; background:#0c1821; font-family:Inter,ui-sans-serif,system-ui,sans-serif; }
    header strong { margin-right:auto; color:#e9f4f7; }
    #status { color:#9fb4bf; font-size:12px; }
    #terminal { flex:1; min-height:300px; margin:0; padding:16px; overflow:auto; white-space:pre-wrap; word-break:break-word; color:#baf7dc; background:#020608; }
    form { display:flex; gap:8px; padding:10px; border-top:1px solid #20323e; background:#0c1821; }
    input { flex:1; min-width:0; border:1px solid #2b4655; background:#071019; color:#fff; border-radius:8px; padding:10px 12px; font:inherit; }
    button { border:1px solid #287565; background:#0f8b78; color:white; border-radius:8px; padding:10px 14px; cursor:pointer; }
    .error { color:#ff9a9a !important; }
  </style>
</head>
<body>
  <header><strong id="title">Container terminal</strong><span id="status">Connecting…</span></header>
  <pre id="terminal" aria-live="polite"></pre>
  <form id="command-form" autocomplete="off"><input id="command" placeholder="Type a command and press Enter" autofocus><button>Send</button></form>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id') || '';
    const name = params.get('name') || id;
    const title = document.querySelector('#title');
    const status = document.querySelector('#status');
    const terminal = document.querySelector('#terminal');
    const input = document.querySelector('#command');
    const form = document.querySelector('#command-form');
    const submit = form.querySelector('button');
    title.textContent = `${name || id} · root terminal`;

    if (!/^[A-Za-z][A-Za-z0-9-]{1,39}$/.test(id)) {
      status.textContent = 'Invalid container name';
      status.classList.add('error');
      throw new Error('Invalid container name');
    }

    const append = text => {
      terminal.textContent += text;
      terminal.scrollTop = terminal.scrollHeight;
    };
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    let socketOpen = false;
    let commandMode = false;
    let websocketFailed = false;
    const ws = new WebSocket(`${protocol}//${location.host}/api/console/container/${encodeURIComponent(id)}`);
    ws.binaryType = 'arraybuffer';

    function enableCommandMode(reason = '') {
      if (commandMode) return;
      commandMode = true;
      status.textContent = 'Command mode';
      status.classList.remove('error');
      append(`LightNAS command mode is ready for ${name} as root.\n`);
      if (reason) append(`${reason}\n`);
      append('Live terminal streaming is unavailable through this connection, but commands will still run normally.\n\n');
      input.focus();
    }

    const connectionTimer = setTimeout(() => {
      if (!socketOpen) {
        websocketFailed = true;
        enableCommandMode('The proxy did not complete the live WebSocket connection.');
      }
    }, 6000);

    ws.addEventListener('open', () => {
      clearTimeout(connectionTimer);
      if (websocketFailed || commandMode) {
        ws.close();
        return;
      }
      socketOpen = true;
      status.textContent = 'Connected';
      append(`Connected to ${name} as root\n`);
      input.focus();
    });
    ws.addEventListener('message', event => {
      const text = typeof event.data === 'string' ? event.data : new TextDecoder().decode(event.data);
      append(text);
    });
    ws.addEventListener('close', event => {
      clearTimeout(connectionTimer);
      socketOpen = false;
      if (!commandMode) enableCommandMode(`Live terminal closed: ${event.reason || event.code}.`);
    });
    ws.addEventListener('error', () => {
      clearTimeout(connectionTimer);
      websocketFailed = true;
      enableCommandMode('The live terminal connection could not be established.');
    });

    async function runCommand(command) {
      submit.disabled = true;
      input.disabled = true;
      append(`root@${name}:~# ${command}\n`);
      try {
        const response = await fetch(`/api/containers/${encodeURIComponent(id)}/exec`, {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', 'X-LightNAS-Request': '1' },
          body: JSON.stringify({ command })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || `Command failed (HTTP ${response.status}).`);
        if (payload.output) append(payload.output.endsWith('\n') ? payload.output : `${payload.output}\n`);
        if (payload.truncated) append('[output truncated by LightNAS]\n');
        if (payload.exitCode) append(`[command exited with code ${payload.exitCode}]\n`);
      } catch (error) {
        append(`[command error: ${error.message}]\n`);
        status.textContent = 'Command failed';
        status.classList.add('error');
      } finally {
        submit.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const command = input.value.trim();
      if (!command) return;
      input.value = '';
      if (socketOpen && ws.readyState === WebSocket.OPEN) {
        ws.send(`${command}\n`);
        return;
      }
      enableCommandMode();
      await runCommand(command);
    });
  </script>
</body>
</html>
